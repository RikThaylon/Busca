services:
  db:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_DB: docs
      POSTGRES_USER: docs
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Defina POSTGRES_PASSWORD em .env}
    volumes: ["postgres:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U docs -d docs"]
      interval: 5s
      retries: 15
    restart: unless-stopped
  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://docs:${POSTGRES_PASSWORD}@db:5432/docs
      DATA_DIR: /app/data
    volumes: ["documents:/app/data"]
    extra_hosts: ["host.docker.internal:host-gateway"]
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
  web:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    ports: ["127.0.0.1:8080:80"]
    depends_on: [api]
    restart: unless-stopped
volumes:
  postgres:
  documents:
